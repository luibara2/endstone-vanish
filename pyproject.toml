[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-vanish"
version = "0.1.7"
description = "Protocol-pinned, per-viewer vanish support for Endstone."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "luibara2" },
]
keywords = [
    "bedrock",
    "endstone",
    "minecraft",
    "vanish",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/luibara2/endstone-vanish"
Issues = "https://github.com/luibara2/endstone-vanish/issues"
Security = "https://github.com/luibara2/endstone-vanish/security/policy"

[project.entry-points."endstone"]
vanish = "endstone_vanish:VanishPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_vanish"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
