name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Vanish is protocol-pinned, so exact client, BDS, and Endstone versions are required.

        **Found a security or player-disclosure problem?** Do not file it here. Follow the private reporting instructions in [SECURITY.md](https://github.com/luibara2/endstone-vanish/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Explain what you did, what you expected, and what happened instead.
      placeholder: A normal player could still see the vanished player's locator marker after...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Join with three players...
        2. Give one viewer the admin tag...
        3. Run /vanish...
    validations:
      required: true

  - type: input
    id: vanish-version
    attributes:
      label: Vanish version
      placeholder: "0.1.7"
    validations:
      required: true

  - type: input
    id: endstone-version
    attributes:
      label: Endstone and BDS versions
      placeholder: "Endstone 0.11.9, BDS 1.26.44"
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Minecraft client version
      placeholder: "1.26.4403"
    validations:
      required: true

  - type: input
    id: protocol-version
    attributes:
      label: Bedrock protocol version
      description: Copy the protocol number from the server log.
      placeholder: "2168"
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: Other plugins
      description: List the other installed plugins and their versions.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove player IP addresses, XUIDs, access tokens, and unrelated personal data before posting.
      render: text
    validations:
      required: false
